<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --primary: #3b82f6;
        --secondary: #22c55e;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --danger: #ef4444;
        --warning: #f59e0b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #020817 0%, #111827 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .app {
        width: min(92vw, 420px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 22px;
        padding: 20px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }

      .title {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .status {
        font-size: 0.7rem;
        color: var(--secondary);
        background: rgba(34, 197, 94, 0.08);
        border: 1px solid rgba(34, 197, 94, 0.2);
        border-radius: 999px;
        padding: 6px 10px;
      }

      .display {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 16px;
        padding: 18px 16px;
        min-height: 122px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .expression {
        min-height: 36px;
        text-align: right;
        font-size: 1.1rem;
        color: var(--muted);
        word-break: break-all;
      }

      .result {
        min-height: 54px;
        text-align: right;
        font-size: clamp(2rem, 5vw, 2.8rem);
        font-weight: 700;
        word-break: break-all;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-top: 18px;
      }

      button {
        border: none;
        border-radius: 14px;
        outline: none;
        min-height: 58px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.1s ease, filter 0.2s ease;
        color: var(--text);
        background: var(--panel-2);
      }

      button:hover {
        filter: brightness(1.1);
      }

      button:active {
        transform: scale(0.98);
      }

      .operator {
        background: rgba(59, 130, 246, 0.15);
        color: #bfdbfe;
      }

      .action {
        background: rgba(245, 158, 11, 0.15);
        color: #fcd34d;
      }

      .equal {
        background: linear-gradient(135deg, var(--primary), #2563eb);
        color: white;
      }

      .history {
        margin-top: 18px;
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .history h3 {
        margin: 0 0 10px;
        font-size: 0.85rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .history-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .history-item {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.88rem;
        color: var(--text);
        background: rgba(31, 41, 55, 0.9);
        border-radius: 10px;
        padding: 8px 10px;
      }

      .history-item span:first-child {
        color: var(--muted);
      }

      @media (max-width: 420px) {
        .app {
          padding: 16px;
        }

        button {
          min-height: 52px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div class="title">Calculator</div>
        <div class="status">Live</div>
      </div>

      <div class="display">
        <div id="expression" class="expression">0</div>
        <div id="result" class="result">0</div>
      </div>

      <div class="buttons">
        <button class="action" data-type="clear">C</button>
        <button class="action" data-type="delete">⌫</button>
        <button class="action" data-type="percent">%</button>
        <button class="operator" data-type="operator">/</button>

        <button data-type="number">7</button>
        <button data-type="number">8</button>
        <button data-type="number">9</button>
        <button class="operator" data-type="operator">*</button>

        <button data-type="number">4</button>
        <button data-type="number">5</button>
        <button data-type="number">6</button>
        <button class="operator" data-type="operator">-</button>

        <button data-type="number">1</button>
        <button data-type="number">2</button>
        <button data-type="number">3</button>
        <button class="operator" data-type="operator">+</button>

        <button data-type="number">0</button>
        <button data-type="number">.</button>
        <button data-type="parenthesis">( )</button>
        <button class="equal" data-type="equals">=</button>
      </div>

      <div class="history">
        <h3>History</h3>
        <ul id="historyList" class="history-list"></ul>
      </div>
    </div>

    <script>
      const expressionEl = document.getElementById('expression');
      const resultEl = document.getElementById('result');
      const historyList = document.getElementById('historyList');

      let expression = '';
      let currentResult = '0';
      let parenthesisOpen = 0;

      function sanitizeExpression(value) {
        return value.replace(/[^0-9+\-*/().%\s]/g, '');
      }

      function updateDisplay() {
        expressionEl.textContent = expression || '0';
        resultEl.textContent = currentResult || '0';
      }

      function saveHistory(entry) {
        const history = JSON.parse(localStorage.getItem('calculatorHistory') || '[]');
        history.unshift(entry);
        const limited = history.slice(0, 5);
        localStorage.setItem('calculatorHistory', JSON.stringify(limited));
        renderHistory();
      }

      function renderHistory() {
        const history = JSON.parse(localStorage.getItem('calculatorHistory') || '[]');
        historyList.innerHTML = '';

        if (!history.length) {
          const emptyItem = document.createElement('li');
          emptyItem.className = 'history-item';
          emptyItem.innerHTML = '<span>No record</span><span>—</span>';
          historyList.appendChild(emptyItem);
          return;
        }

        history.forEach((item) => {
          const li = document.createElement('li');
          li.className = 'history-item';
          li.innerHTML = `<span>${item.expression}</span><span>${item.result}</span>`;
          historyList.appendChild(li);
        });
      }

      function appendNumber(value) {
        if (value === '.' && expression.endsWith('.')) return;
        if (value === '.' && expression === '') {
          expression = '0.';
        } else {
          expression += value;
        }
        currentResult = evaluatePreview(expression);
        updateDisplay();
      }

      function appendOperator(operator) {
        const lastChar = expression.slice(-1);
        if (!expression || ['+', '-', '*', '/', '%'].includes(lastChar)) {
          if (operator === '-' && (expression === '' || ['+', '*', '/'].includes(lastChar))) {
            expression += operator;
          } else if (expression && lastChar !== operator) {
            expression = expression.slice(0, -1) + operator;
          }
        } else {
          expression += operator;
        }

        currentResult = evaluatePreview(expression);
        updateDisplay();
      }

      function toggleParenthesis() {
        const lastChar = expression.slice(-1);
        const validOpen = /[0-9)]$/.test(lastChar) || !expression;

        if (validOpen && parenthesisOpen === 0) {
          expression += '(';
          parenthesisOpen += 1;
        } else if (parenthesisOpen > 0 && /[0-9)]$/.test(lastChar)) {
          expression += ')';
          parenthesisOpen -= 1;
        } else if (!expression) {
          expression += '(';
          parenthesisOpen += 1;
        }

        currentResult = evaluatePreview(expression);
        updateDisplay();
      }

      function evaluatePreview(expr) {
        if (!expr || !sanitizeExpression(expr)) return '0';

        try {
          const safeExpr = sanitizeExpression(expr)
            .replace(/%/g, '/100')
            .replace(/\s+/g, '');

          const result = Function(`'use strict'; return (${safeExpr});`)();
          if (!Number.isFinite(result)) {
            return 'Error';
          }
          return Number(result.toFixed(10)).toString();
        } catch (error) {
          return 'Error';
        }
      }

      function clearAll() {
        expression = '';
        currentResult = '0';
        parenthesisOpen = 0;
        updateDisplay();
      }

      function deleteLast() {
        if (!expression) return;
        expression = expression.slice(0, -1);
        if (expression.endsWith('(')) parenthesisOpen = Math.max(0, parenthesisOpen - 1);
        if (expression.endsWith(')')) parenthesisOpen += 1;
        currentResult = evaluatePreview(expression);
        updateDisplay();
      }

      function applyPercent() {
        if (!expression) return;
        const lastNumber = expression.match(/(?:\d+\.?\d*|\.\d+)$/);
        if (!lastNumber) return;
        const number = Number(lastNumber[0]);
        const before = expression.slice(0, -lastNumber[0].length);
        expression = before + (number / 100);
        currentResult = evaluatePreview(expression);
        updateDisplay();
      }

      function calculate() {
        if (!expression) return;

        const safeExpr = sanitizeExpression(expression)
          .replace(/%/g, '/100')
          .replace(/\s+/g, '');

        try {
          const result = Function(`'use strict'; return (${safeExpr});`)();
          if (!Number.isFinite(result)) {
            throw new Error('Invalid expression');
          }

          const formatted = Number(result.toFixed(10)).toString();
          saveHistory({ expression, result: formatted });
          expression = formatted;
          currentResult = formatted;
          updateDisplay();
        } catch (error) {
          currentResult = 'Error';
          updateDisplay();
        }
      }

      document.querySelectorAll('[data-type="number"]').forEach((button) => {
        button.addEventListener('click', () => {
          const value = button.textContent.trim();
          appendNumber(value);
        });
      });

      document.querySelectorAll('[data-type="operator"]').forEach((button) => {
        button.addEventListener('click', () => appendOperator(button.textContent.trim()));
      });

      document.querySelector('[data-type="clear"]').addEventListener('click', clearAll);
      document.querySelector('[data-type="delete"]').addEventListener('click', deleteLast);
      document.querySelector('[data-type="percent"]').addEventListener('click', applyPercent);
      document.querySelector('[data-type="equals"]').addEventListener('click', calculate);
      document.querySelector('[data-type="parenthesis"]').addEventListener('click', toggleParenthesis);

      document.addEventListener('keydown', (event) => {
        const { key } = event;

        if (/^[0-9]$/.test(key)) appendNumber(key);
        if (['+', '-', '*', '/'].includes(key)) appendOperator(key);
        if (key === '.') appendNumber('.');
        if (key === 'Enter' || key === '=') calculate();
        if (key === 'Backspace') deleteLast();
        if (key === 'Escape') clearAll();
        if (key === '(' || key === ')') {
          if (key === '(') {
            expression += '(';
            parenthesisOpen += 1;
          } else {
            if (parenthesisOpen > 0) {
              expression += ')';
              parenthesisOpen -= 1;
            }
          }
          currentResult = evaluatePreview(expression);
          updateDisplay();
        }
      });

      renderHistory();
      updateDisplay();
    </script>
  </body>
</html>
